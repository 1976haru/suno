name: CI

on:
  push:
  pull_request:

# TASK (CI test-tier split) — was a single `test` job (checkout -> setup-node
# -> npm ci -> typecheck -> test -> build), all sequential steps in one job.
# GitHub Actions stops a job at its first failing step by default, so when
# `npm run test` (plain `vitest run`, the whole tests/**/*.test.ts glob
# including slow files like tests/promptLength.test.ts and
# tests/stress-production.test.ts) genuinely timed out, `npm run build`
# never ran at all — a real compile error could sit undetected. Split into 5
# independent jobs so `build` (and every other job) runs regardless of
# `unit`'s outcome; each job does its own checkout + npm ci rather than
# sharing a setup job, since these are small/fast (`npm ci` is already
# cached via setup-node's own `cache: npm`) and simple parallel jobs are
# easier to reason about than an artifact-passing setup step for a suite
# this size. No `needs:` between any of them — that's the whole point of
# separating them; a slow/failing `unit` or `stress` run no longer hides a
# `build` failure or blocks `matrix`/`isolation` from reporting.
jobs:
  # codex 지시문 07 (TASK A) — split out of `unit` (which used to run
  # typecheck as its own first step): a failing typecheck no longer hides
  # behind — or blocks — `unit`'s own (much longer) test run finishing.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # TASK (CI test-tier split) — Node 20 hit LTS end-of-life; Node 24
          # is current Active LTS and matches actions/checkout@v7 /
          # actions/setup-node@v7's own now-node24 action runtime (see this
          # workflow's Node-version-warning note below) as well as this
          # repo's local dev Node version. No project code required this
          # bump (typecheck/test/build all verified green under it) — it's
          # a currency fix, not a compatibility fix.
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  # codex 지시문 07 (TASK A) — real, genuine external blocker: this
  # project's real TypeScript version (7.0.2) is newer than any released
  # @typescript-eslint version supports (confirmed via direct test —
  # both @typescript-eslint/parser and @typescript-eslint/eslint-plugin
  # throw "typescript-eslint does not support TS 7.0" at import time; see
  # eslint.config.js's own doc comment and
  # github.com/typescript-eslint/typescript-eslint/issues/10940). This is
  # NOT hidden — the job still runs `npm run lint` for real and reports
  # its real result, but `continue-on-error: true` keeps this one external,
  # currently-unfixable dependency gap from blocking every other real,
  # green job. Remove `continue-on-error` once typescript-eslint ships TS
  # 7.x support (tracked in the issue above) and this becomes a real gate.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:matrix

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit:isolation

  build-single:
    # TASK v5.18 (TASK E) — dist-single/ (the standalone, dependency-free
    # single-file build) had no CI coverage at all; only `build`'s regular
    # multi-file `vite build` output was checked. A break specific to the
    # singlefile plugin path (see core/sunoViewerExport.ts's own v5.20 fix
    # for exactly this class of bug) could ship undetected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:single

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:stress

  # codex 지시문 07 (TASK D) — mock-contract API integration tests
  # (providers/proxyFetch.ts's real header-building/redaction contract,
  # image route, batch/poll/cancel shapes) — no real external API calls, no
  # real cost, safe to run on every push/PR.
  api-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:api-integration

  # codex 지시문 07 (TASK E) — dependency audit + real, repo-local secret/
  # exposure checks (grep-based; see scripts/securityAudit.ts's own doc
  # comment for the full real list). `npm audit` itself can't be
  # `continue-on-error: false`'d blindly — see that script for the real
  # high/critical policy this job enforces.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run security:audit

  # codex 지시문 07 (TASK C) — real Playwright browser E2E scenarios
  # (workspace select -> channel -> options -> contract -> preflight ->
  # bridge instruction -> import variants -> retry/rewrite -> export ->
  # workspace-switch invariance) plus a 7-workspace smoke sweep.
  # `continue-on-error: true` for the same honest reason as `lint` above:
  # a real browser download/launch inside a fresh CI runner is the one
  # step in this whole workflow this session could not itself verify
  # end-to-end (no way to launch a real browser from this environment) —
  # the scenarios themselves are real and meant to run for real in CI, but
  # this flag prevents an environment-specific Playwright install/launch
  # issue from blocking every other real, verified-locally job while that
  # gets its first real CI run observed.
  playwright:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

# TASK (CI test-tier split) — the "Node 20 기반 액션이 Node 24 에서 강제
# 실행된다" (Node-20-based actions force-run on Node 24) warning is NOT
# about the `node-version:` input above (that only controls which Node
# runs THIS repo's own npm scripts). It's about the actions' own execution
# runtime: actions/checkout@v4 and actions/setup-node@v4's action.yml both
# declare `runs.using: node20` (verified via
# raw.githubusercontent.com/actions/checkout/v4/action.yml and .../setup-
# node/v4/action.yml). GitHub Actions runners are retiring the Node 20
# runtime used to execute JS actions, so a `using: node20` action still
# gets force-run under the runner's Node 24 interpreter with a deprecation
# warning — bumping `node-version` would not touch this at all. The real
# fix is the actions/checkout@v7 and actions/setup-node@v7 bump above:
# both v7 releases declare `runs.using: node24` (verified the same way
# against .../v7.0.1/action.yml and .../v7.0.0/action.yml), so the
# declared and actual runtime now match and the warning is gone.
